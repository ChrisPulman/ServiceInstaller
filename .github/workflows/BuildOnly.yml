name: BuildOnly

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  windows-latest:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj
            **/global.json

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-prerelease: true

      - name: Compile
        run: ./build.cmd Compile --configuration Release
        env:
          NUKE_TELEMETRY_OPTOUT: 'true'

      - name: Tests and coverage
        shell: bash
        working-directory: src
        run: |
          dotnet test --solution ServiceInstaller.slnx \
            --configuration Release \
            --no-build \
            --max-parallel-test-modules 1 \
            --coverage \
            --coverage-output-format cobertura \
            --results-directory ./TestResults

      - name: Verify 100% production coverage
        shell: pwsh
        working-directory: src
        run: ./eng/verify-coverage.ps1 -ResultsDirectory ./TestResults

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./**/TestResults/**/*.cobertura.xml
          if-no-files-found: error
          retention-days: 7
